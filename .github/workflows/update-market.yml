name: Update market data
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/update-market.yml"
  schedule:
    # Taiwan cash session needs a much faster refresh cadence.
    # 00:00-06:59 UTC = 08:00-14:59 Asia/Taipei.
    - cron: '*/5 0-6 * * 1-5'
    # Outside Taiwan cash-session hours, 30-minute updates are sufficient.
    - cron: '*/30 7-23 * * 1-5'
permissions:
  contents: write
concurrency:
  group: market-data
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Update JSON data
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
        run: |
          python scripts/run_update.py
          # Closing-stat enrichment is useful, but must never block intraday TAIEX.
          python scripts/fix_twse_stats.py || echo "close-stat enrichment unavailable; preserving last valid close stats"
          # During 09:00-13:30 Taipei time this overwrites TAIEX with TWSE MIS live data.
          python scripts/live_twse.py
      - name: Commit data
        run: |
          git config user.name "treasury-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update market data"
          git pull --rebase origin main
          git push
